name: Generate
permissions:
  checks: write
  contents: write
  pull-requests: write
  statuses: write
  id-token: write
"on":
  workflow_dispatch:
    inputs:
      force:
        description: Force generation of SDKs
        type: boolean
        default: false
      set_version:
        description: optionally set a specific SDK version
        type: string
  schedule:
    - cron: 0 0 * * *
env:
  SPEAKEASY_BUMP_OVERRIDE: patch
jobs:
  # we run this only for version branches, where we set tag to the YYYY.MM value,
  # for main brach we do not use it as it's always a pre-release version like 0.0.0-dev
  get-npm-tag:
    runs-on: ubuntu-latest
    outputs:
      npm_tag: ${{ steps.extract.outputs.tag }}
    steps:
      - name: Extract npm tag from branch name
        id: extract
        run: |
          BRANCH="${{ github.ref_name }}"
          if [[ "$BRANCH" == "main" ]]; then
            TAG="dev"
          elif [[ "$BRANCH" == versions/* ]]; then
            TAG="${BRANCH#versions/}"
            TAG="${TAG//./-}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
  generate:
    needs: get-npm-tag
    uses: speakeasy-api/sdk-generation-action/.github/workflows/workflow-executor.yaml@v15
    with:
      force: ${{ github.event.inputs.force }}
      mode: direct
      set_version: ${{ github.event.inputs.set_version }}
      npm_tag: ${{ needs.get-npm-tag.outputs.npm_tag }}
      environment: |
        SPEAKEASY_BUMP_OVERRIDE=patch
    secrets:
      github_access_token: ${{ secrets.GITHUB_TOKEN }}
      speakeasy_api_key: ${{ secrets.SPEAKEASY_API_KEY }}
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK }}
  # npm's `latest` tag follows the release line of the stable API version,
  # as listed in docs.moov.io/api-versions.json. Only the stable line's
  # branch moves it, so older lines can't take it over.
  point-latest:
    needs: [get-npm-tag, generate]
    if: ${{ startsWith(github.ref_name, 'versions/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - name: Point latest at the stable line
        env:
          NPM_TAG: ${{ needs.get-npm-tag.outputs.npm_tag }}
        run: |
          PKG="@moovio/sdk"
          if ! STABLE=$(curl -fsSL https://docs.moov.io/api-versions.json | jq -er .stable); then
            echo "::warning::Could not read 'stable' from docs.moov.io/api-versions.json; leaving 'latest' alone."
            exit 0
          fi
          LINE="v${NPM_TAG/-/.}.00"
          if [[ "$LINE" != "$STABLE" ]]; then
            echo "$LINE is not the stable API version ($STABLE); leaving 'latest' alone"
            exit 0
          fi

          TARGET=$(npm view "$PKG@$NPM_TAG" version || true)
          CURRENT=$(npm view "$PKG" dist-tags.latest || true)
          if [[ -z "$TARGET" ]]; then
            echo "Nothing published under '$NPM_TAG' yet; leaving 'latest' alone"
            exit 0
          fi
          if [[ "$TARGET" == "$CURRENT" ]]; then
            echo "'latest' is already $TARGET"
            exit 0
          fi

          # dist-tag over trusted publishing (OIDC) needs npm 11.21+ and
          # "Allow npm dist-tag" on the package's trusted publisher.
          npm install -g "npm@>=11.21.0 <12"
          if npm dist-tag add "$PKG@$TARGET" latest; then
            echo "Moved 'latest' from $CURRENT to $TARGET"
          else
            echo "::warning::Could not move 'latest' from $CURRENT to $TARGET. Check the npm trusted publisher allows dist-tag."
          fi
